<script>
var SERVEUR = "https://script.google.com/macros/s/AKfycbyi__RKASnF8TeDW7ObxW1B_UvmNceJzCCiMifSXSmUbw7mjb92Q6GpypdQVPdEW9c80A/exec";
(function(){
  function appel(fn, args){
    // text/plain : requête « simple », sans cookies ni comptes Google (credentials: 'omit')
    return fetch(SERVEUR, { method:'POST', body: JSON.stringify({ fn: fn, args: args }), headers:{ 'Content-Type':'text/plain;charset=utf-8' }, credentials:'omit', redirect:'follow' })
      .then(function(r){ if(!r.ok) throw new Error('Erreur réseau (' + r.status + ')'); return r.json(); })
      .then(function(o){ if(!o.ok) throw new Error(o.error || 'Erreur'); return o.result; });
  }
  var handler = null;
  window.google = { script: {
    get run(){
      var h = { ok:null, ko:null };
      var p = new Proxy({}, { get: function(t, name){
        if(name === 'withSuccessHandler') return function(f){ h.ok = f; return p; };
        if(name === 'withFailureHandler') return function(f){ h.ko = f; return p; };
        return function(){ var args = Array.prototype.slice.call(arguments);
          appel(name, args).then(function(r){ h.ok && h.ok(r); }, function(e){ h.ko && h.ko(e); }); };
      }});
      return p;
    },
    history: {
      push: function(state, params){ history.pushState(state, '', qs(params)); },
      replace: function(state, params){ history.replaceState(state, '', qs(params)); },
      setChangeHandler: function(f){ handler = f; }
    }
  }};
  function qs(params){ var u = new URLSearchParams(params || {}).toString(); return location.pathname + (u ? '?' + u : ''); }
  window.addEventListener('popstate', function(e){ handler && handler({ state: e.state }); });
})();
</script>

<body>
<header><h1 id="title">Espace bureau</h1><button id="homeBtn" style="display:none" onclick="logout()">Quitter</button></header>
<nav id="nav" hidden></nav>
<main id="app"></main>

<script>
var BOOT = (function(){
  var q = new URLSearchParams(location.search), clean = function(v){ return String(v||'').replace(/[^A-Za-z0-9._~-]/g,'').slice(0,2000); };
  return { k: clean(q.get('k')), g: clean(q.get('g')), r: clean(q.get('r')), googleLogin: '', syndicat: 'Syndic' };
})();
call('bootInfo').then(function(b){ if(b){ BOOT.syndicat = b.syndicat || BOOT.syndicat; BOOT.googleLogin = b.googleLogin || ''; } }, function(){});
var S = { session:null, k:null, me:null, apts:null };
var STORE = 'syndic.session';

// ---------- utilitaires ----------
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function dh(x){ var n=Math.round((Number(x)||0)*100)/100; return n.toFixed(n%1?2:0).replace(/\B(?=(\d{3})+(?!\d))/g,' ')+' DH'; }
function today(){ var d=new Date(); return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2); }
function busy(on){ $('busy').style.display = on?'flex':'none'; }
var CURRENT_SPACE = 'dashboard';
var ROUTE_SPACE = { dashboard:'dashboard', appart:'dashboard', mouvements:'dashboard', afaire:'dashboard', tableau:'dashboard', appartements:'dashboard',
  tresorerie:'tresorerie', compta:'tresorerie', etats:'tresorerie', budget:'tresorerie', rappro:'tresorerie', cloture:'tresorerie', factures:'tresorerie', liensCopro:'tresorerie', signalements:'tresorerie', demandes:'secretariat', paiement:'tresorerie', depense:'tresorerie', justifs:'tresorerie', relances:'tresorerie', decharge:'tresorerie',
  secretariat:'secretariat', reunions:'secretariat', reunionNew:'secretariat', reunion:'secretariat', presences:'secretariat', decisions:'secretariat', incidents:'secretariat', contrats:'secretariat',
  projets:'secretariat', admin:'admin', acces:'admin', donnees:'admin', demarrage:'admin', monappart:'monappart' };
function renderNav(){
  var n=$('nav'); if(!S.session || !S.me){ n.hidden=true; return; }
  var tabs=[['dashboard','Tableau de bord']];
  if(has('tresorier')) tabs.push(['tresorerie','Trésorerie']);
  if(has('secretaire')) tabs.push(['secretariat','Secrétariat']);
  if(has('admin')) tabs.push(['admin','Admin']);
  if(S.me && S.me.apt) tabs.push(['monappart','Mon appartement']);
  n.innerHTML = tabs.map(function(t){ return '<button class="'+(t[0]===CURRENT_SPACE?'on':'')+'" onclick="go(\''+t[0]+'\')">'+t[1]+'</button>'; }).join('');
  n.hidden=false;
}
// Thème « Registre » : pas d'emojis décoratifs (on garde ✓ ✔ ✗ ½ • et les flèches)
var EMOJI = /[\u{1F000}-\u{1FAFF}\u{2600}-\u{2712}\u{2718}-\u{27BF}\u{2B00}-\u{2BFF}\u{23E9}-\u{23FA}\u{FE0F}\u{200D}]/gu;
function stripEmoji(root){
  if(!root) return;
  if(root.nodeType===3){ if(EMOJI.test(root.nodeValue)) root.nodeValue = root.nodeValue.replace(EMOJI,'').replace(/^\s+(?=\S)/,''); EMOJI.lastIndex=0; return; }
  var w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null), n;
  while((n = w.nextNode())){ if(EMOJI.test(n.nodeValue)) n.nodeValue = n.nodeValue.replace(EMOJI,'').replace(/^\s+(?=\S)/,''); EMOJI.lastIndex=0; }
}
new MutationObserver(function(ms){ ms.forEach(function(m){ Array.prototype.forEach.call(m.addedNodes, stripEmoji); }); }).observe(document.documentElement, {childList:true, subtree:true});
function view(title, html){ $('title').textContent = title; $('app').innerHTML = html; $('homeBtn').style.display = S.session?'inline-block':'none'; renderNav(); if(!S.silent) window.scrollTo(0,0); }
function showErr(msg){ var e=document.querySelector('.err'); if(e) e.remove(); var d=document.createElement('div'); d.className='err'; d.textContent=msg; $('app').appendChild(d); d.scrollIntoView({behavior:'smooth'}); }
function has(){ var roles=(S.me&&S.me.roles)||[]; for(var i=0;i<arguments.length;i++){ if(roles.indexOf(arguments[i])>=0) return true; } return roles.indexOf('admin')>=0; }
function saveStore(){ try{ localStorage.setItem(STORE, JSON.stringify({k:S.k, session:S.session})); }catch(e){} }
function loadStore(){ try{ return JSON.parse(localStorage.getItem(STORE)||'null'); }catch(e){ return null; } }
function clearStore(){ try{ localStorage.removeItem(STORE); localStorage.removeItem(CCSTORE()); }catch(e){} }
/** Écrans déjà vus, gardés sur le téléphone : à la réouverture, ils s'affichent tout de suite puis se mettent à jour. */
function CCSTORE(){ return 'syndic.cc.'+(S.k||'').slice(0,16); }
var ccTimer = null;
function persistCC(){ clearTimeout(ccTimer); ccTimer = setTimeout(function(){ try{ localStorage.setItem(CCSTORE(), JSON.stringify(CC)); }catch(e){} }, 300); }
function loadCC(){ try{ var o = JSON.parse(localStorage.getItem(CCSTORE())||'null'); if(o){ var now = Date.now(); Object.keys(o).forEach(function(k){ o[k].t = now; }); CC = o; } }catch(e){} }

function call(fn){
  var args = Array.prototype.slice.call(arguments,1);
  return new Promise(function(res, rej){
    var r = google.script.run.withSuccessHandler(res).withFailureHandler(function(e){ rej(new Error(e && e.message || 'Erreur réseau')); });
    r[fn].apply(r, args);
  });
}
// ---------- Rapidité : cache des lectures dans le navigateur ----------
// Un écran déjà vu s'affiche tout de suite, puis se met à jour en arrière-plan.
// Toute écriture (paiement, dépense…) vide ce cache : jamais de donnée périmée après une action.
var READS = { 'moi':1, 'dashboard.global':1, 'appartement.detail':1, 'appartements.liste':1, 'tableau':1, 'mouvements.liste':1, 'relances.liste':1,
  'reunions.liste':1, 'decisions.liste':1, 'incidents.liste':1, 'contrats.liste':1, 'projets.liste':1, 'depense.liste':1, 'paiement.liste':1,
  'messages.liste':1, 'categories.liste':1, 'signalements.liste':1, 'demandes.liste':1, 'etats.exercices':1, 'etats.get':1, 'budget.get':1,
  'rappro.liste':1, 'clotures.liste':1, 'admin.donnees':1, 'residents.liste':1, 'acces.liste':1, 'fichiers.liste':1 };
var CC = {}, CC_GEN = 0, CC_TTL = 15*60*1000;
var busyTimer = null;
function busySoon(on){ // « Patientez… » seulement si l'attente dépasse 0,4 s
  if(on){ if(!busyTimer) busyTimer = setTimeout(function(){ busy(true); }, 400); }
  else { clearTimeout(busyTimer); busyTimer = null; busy(false); }
}
function rawApi(action, payload){
  return call('api', S.session, action, payload||{}).then(function(r){
    if(!r.ok){ if(r.error==='SESSION_EXPIREE'){ CC={}; clearStore(); S.session=null; start(); throw new Error('Session expirée, reconnectez-vous.'); } throw new Error(r.error); }
    return r.data;
  });
}
function userIsEditing(){
  var a = document.activeElement;
  if(a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) return true;
  return !!document.querySelector('#app details[open]') || !!$('docsheet');
}
function api(action, payload){
  var key = READS[action] ? action+'|'+JSON.stringify(payload||{}) : null;
  if(!key){ CC = {}; CC_GEN++; persistCC(); }     // écriture : on oublie tout
  var gen = CC_GEN;
  var hit = key && CC[key];
  if(hit && Date.now()-hit.t < CC_TTL){
    var route = S.route;
    if(!S.silent && Date.now()-hit.t > 5000) rawApi(action, payload).then(function(d){   // donnée toute récente : pas de nouvel aller-retour
      if(gen !== CC_GEN) return;
      var changed = JSON.stringify(d) !== JSON.stringify(hit.data);
      CC[key] = { t: Date.now(), data: d }; persistCC();
      // mise à jour discrète : seulement en haut de page, sans saisie en cours, et sans faire bouger la page
      if(changed && route && S.route === route && !userIsEditing() && window.scrollY < 80 && ROUTES[route.name]){
        var y = window.scrollY; S.silent = true;
        try { ROUTES[route.name](route.arg); } catch(e){}
        setTimeout(function(){ S.silent = false; window.scrollTo(0, y); }, 400);
      }
    }).catch(function(){});
    return Promise.resolve(JSON.parse(JSON.stringify(hit.data)));
  }
  busySoon(true);
  return rawApi(action, payload).then(function(d){
    busySoon(false);
    if(key && gen === CC_GEN){ CC[key] = { t: Date.now(), data: d }; persistCC(); }
    return d;
  }, function(e){ busySoon(false); throw e; });
}
/** Même chose qu'api(), mais renvoie {ok, data | error} (sans exception). */
function apiOk(action, payload){ return api(action, payload).then(function(d){ return {ok:true, data:d}; }, function(e){ return {ok:false, error:e.message}; }); }
/** Préchargement discret des écrans les plus utilisés. */
function prefetch(list){
  var todo = list.filter(function(x){ return !CC[x[0]+'|'+JSON.stringify(x[1]||{})]; });
  if(!todo.length || !S.session) return;
  call('apiBatch', S.session, todo).then(function(res){   // un seul aller-retour pour tous les écrans
    (res||[]).forEach(function(r, i){ if(r && r.ok) CC[todo[i][0]+'|'+JSON.stringify(todo[i][1]||{})] = { t: Date.now(), data: r.data }; });
    persistCC();
  }).catch(function(){});
}
function guard(p){ return p.catch(function(e){ showErr(e.message); }); }

/** Lit un fichier (photo réduite à 1600 px, ou PDF) en base64 */
function readFile(input){
  var f = input && input.files && input.files[0];
  if(!f) return Promise.resolve(null);
  if(f.size > 15*1024*1024 && !/^image\//.test(f.type)) return Promise.reject(new Error('Fichier trop lourd (15 Mo max).'));
  return new Promise(function(res, rej){
    var fr = new FileReader();
    fr.onerror = function(){ rej(new Error('Lecture du fichier impossible.')); };
    fr.onload = function(){
      if(!/^image\//.test(f.type)) return res({ name:f.name, mimeType:f.type||'application/pdf', data:String(fr.result).split(',')[1] });
      var img = new Image();
      img.onload = function(){
        var max=1600, w=img.width, h=img.height, r=Math.min(1, max/Math.max(w,h));
        var c=document.createElement('canvas'); c.width=Math.round(w*r); c.height=Math.round(h*r);
        c.getContext('2d').drawImage(img,0,0,c.width,c.height);
        res({ name:(f.name||'photo').replace(/\.\w+$/,'')+'.jpg', mimeType:'image/jpeg', data:c.toDataURL('image/jpeg',0.82).split(',')[1] });
      };
      img.onerror = function(){ res({ name:f.name, mimeType:f.type, data:String(fr.result).split(',')[1] }); };
      img.src = fr.result;
    };
    fr.readAsDataURL(f);
  });
}

function start(){

    return call('authLoginGoogle', g).then(function(r){ busy(false); if(!r.ok) return noAccess(r.error); S.k='google'; S.session=r.data.session; saveStore(); home(); });
  }
  var st = loadStore();
  if(BOOT.k){
    S.k = BOOT.k;
    if(st && st.k===BOOT.k && st.session){ S.session=st.session; loadCC(); return home(); }
    return pinScreen();
  }
  noAccess();
}
function tryResume(fallback){
  busy(true);
  call('api', S.session, 'moi', {}).then(function(r){ busy(false); if(r.ok){ S.me=r.data; home(); } else { S.session=null; clearStore(); fallback(); } }, function(){ busy(false); fallback(); });

function pinScreen(){
  busy(true);

        busy(false);

        if(L && L[0] && L[0].ok){ CC['moi|{}'] = { t: Date.now(), data: L[0].data }; if(L[1] && L[1].ok) CC['dashboard.global|{}'] = { t: Date.now(), data: L[1].data }; persistCC(); }

// ---------- navigation ----------
var ROUTES = {};
function spaceAllowed(sp){ return sp==='dashboard' || (sp==='monappart' && S.me && S.me.apt) || (sp==='tresorerie'&&has('tresorier')) || (sp==='secretariat'&&has('secretaire')) || (sp==='admin'&&has('admin')); }
/** Bouton « Retour » du téléphone : chaque écran est ajouté à l'historique de l'application
 *  (google.script.history), pour que « Retour » revienne à l'écran précédent au lieu de quitter l'application. */
var HIST = { ready:false, first:true };
function histParams(){ var p = {}; if(BOOT.k) p.k = BOOT.k; if(BOOT.r) p.r = BOOT.r; return p; }
function histInit(){
  if(HIST.ready) return; HIST.ready = true;
  try {
    google.script.history.setChangeHandler(function(e){
      var st = e && e.state;
      if(!S.session) return;                       // pas connecté : l'écran de code reste affiché
      if(st && st.r && ROUTES[st.r]) go(st.r, st.a === null ? undefined : st.a, true);
      else go('dashboard', undefined, true);
    });
  } catch(e){}
}
function histPush(name, arg){
  try {
    histInit();
    var st = { r:name, a:(arg===undefined?null:arg) };
    if(HIST.first){ HIST.first = false; google.script.history.replace(st, histParams()); }
    else google.script.history.push(st, histParams());
  } catch(e){}
}
function go(name, arg, fromHistory){
  if(!fromHistory) histPush(name, arg);
  var sp = ROUTE_SPACE[name];
  if(name==='messages') sp = (CURRENT_SPACE==='secretariat'||!has('tresorier')) ? 'secretariat' : 'tresorerie';
  if(sp && spaceAllowed(sp)) CURRENT_SPACE = sp;
  S.route = { name: name, arg: arg };
  if(name !== 'monappart' && window.R) R.bureau = false;
  var f=ROUTES[name]; if(f) f(arg);
}

/** Après connexion : profil, puis tableau de bord global ; puis préchargement des écrans courants. */
function home(){
  var cm = CC['moi|{}'];
  if(cm){ S.me = cm.data; go('dashboard'); }      // déjà vu sur ce téléphone : affichage immédiat
  if(cm && Date.now()-cm.t < 5000){ setTimeout(prechargerEcrans, 1500); return; }   // reçu à l'instant (avec la connexion)
  if(!cm) busySoon(true);
  call('apiBatch', S.session, [['moi',{}], ['dashboard.global',{}]]).then(function(res){
    busySoon(false);
    var r0 = res[0], r1 = res[1];
    if(!r0.ok){
      if(r0.error==='SESSION_EXPIREE'){ CC={}; clearStore(); S.session=null; return start(); }
      return showErr(r0.error);
    }
    var dk = 'dashboard.global|{}', old = CC[dk];
    var changed = !cm || JSON.stringify(cm.data)!==JSON.stringify(r0.data) || !old || (r1.ok && JSON.stringify(old.data)!==JSON.stringify(r1.data));
    CC['moi|{}'] = { t: Date.now(), data: r0.data };
    if(r1.ok) CC[dk] = { t: Date.now(), data: r1.data };
    persistCC();
    S.me = r0.data;
    if(!cm) go('dashboard');
    else if(changed && S.route && S.route.name==='dashboard' && window.scrollY < 80 && !userIsEditing()){
      S.silent = true; try{ ROUTES.dashboard(S.route.arg); }catch(e){} setTimeout(function(){ S.silent = false; }, 400);
    }
    setTimeout(prechargerEcrans, 1500);
  }, function(e){ busySoon(false); showErr(e.message); });
}
function prechargerEcrans(){
    (function(){
      var l = [['mouvements.liste',{}], ['reunions.liste',{}], ['appartements.liste',{}]];
      if(has('tresorier')) l.push(['relances.liste',{}], ['categories.liste',{}], ['depense.liste',{manquants:true}]);
      if(has('secretaire')) l.push(['demandes.liste',{}], ['projets.liste',{}]);
      prefetch(l);
    })();
}

ROUTES.presences = function(id){

      (r.ag?'<p class="muted">Quorum : la moitié des copropriétaires présents ou représentés (art. 18). Un mandataire : 3 procurations au maximum (art. 16 decies). ⚠ = copropriétaire non à jour, non admis à l\'AG (art. 16 quinquies).</p>':'')+
      (ed?'<input id="pr_search" type="text" placeholder="Rechercher un appartement ou un nom">':'')+'</div><div class="card list" id="pr_list">'+
      L.map(function(l,i){
        return '<div class="item" data-q="'+esc((l.id+' '+l.nom).toLowerCase())+'"><b>'+esc(l.id)+'</b> – '+esc(l.nom)+(r.ag&&l.debiteur?' <span class="st-retard">⚠ '+dh(l.du)+'</span>':'')+
          (ed?'<div class="row"><select data-i="'+i+'" class="pr_sel" style="width:auto">'+['absent','présent','représenté'].map(function(o){return '<option'+(o===l.presence?' selected':'')+'>'+o+'</option>';}).join('')+'</select>'+
            '<input data-i="'+i+'" class="pr_rep" type="text" placeholder="Représenté par (nom)" value="'+esc(l.representePar||'')+'" style="flex:1;'+(l.presence==='représenté'?'':'display:none')+'"></div>'
            :'<br><span class="muted">'+esc(l.presence)+(l.representePar?' par '+esc(l.representePar):'')+'</span>')+'</div>';
      }).join('')+'</div>'+
      (ed?(r.ag?'<div class="card"><label>Président de séance (pas le syndic)</label><input id="pr_pres" type="text" value="'+esc(r.presidentSeance||'')+'"><label>Secrétaire de séance</label><input id="pr_secr" type="text" value="'+esc(r.secretaireSeance||'')+'"></div>':'')+
        '<button class="btn pri" id="pr_save">Enregistrer les présences</button>':'')+
      '<button class="btn sec" onclick="go(\'reunion\',\''+esc(id)+'\')">Retour à la réunion</button>';
    view('Présences', h);
    function count(){
      var p=0,rep=0; L.forEach(function(l){ if(l.presence==='présent')p++; if(l.presence==='représenté')rep++; });
      var need=Math.ceil(L.length/2);
      $('pr_count').innerHTML = (p+rep)+' / '+L.length+(r.ag?' · quorum '+((p+rep)>=need||r.liee?'<span class="st-a_jour">atteint</span>':'<span class="st-retard">non atteint ('+need+' requis)</span>'):'');
    }
    count();
    if(!ed) return;
    Array.prototype.forEach.call(document.querySelectorAll('.pr_sel'), function(s){ s.onchange=function(){
      var i=+s.getAttribute('data-i'); L[i].presence=s.value; document.querySelector('.pr_rep[data-i="'+i+'"]').style.display = s.value==='représenté'?'':'none'; count(); }; });
    Array.prototype.forEach.call(document.querySelectorAll('.pr_rep'), function(x){ x.oninput=function(){ L[+x.getAttribute('data-i')].representePar=x.value; }; });
    $('pr_search').oninput=function(){ var q=this.value.toLowerCase(); Array.prototype.forEach.call(document.querySelectorAll('#pr_list .item'), function(it){ it.style.display = it.getAttribute('data-q').indexOf(q)>=0?'':'none'; }); };
    $('pr_save').onclick=function(){
      guard(api('reunion.presencesEnregistrer',{id:id, lignes:L.map(function(l){ return {id:l.id, presence:l.presence, representePar:l.representePar}; }),
        presidentSeance:$('pr_pres')&&$('pr_pres').value, secretaireSeance:$('pr_secr')&&$('pr_secr').value}).then(function(v){
        go('reunion', id);
        if(v.debiteursPresents && v.debiteursPresents.length && r.ag) setTimeout(function(){ showErr('Attention : copropriétaire(s) non à jour inscrit(s) présent(s) ou représenté(s) : '+v.debiteursPresents.join(', ')+'. La loi prévoit qu\'ils ne sont pas admis (art. 16 quinquies).'); }, 600);
      }));
    };
  }));
};

function gridTable(g, f, q){
  var rows = g.rows.filter(function(r){
    if(f==='retard' && r.statut!=='retard') return false;
    if(f==='avance' && r.statut!=='avance') return false;
    if(q && (r.id+' '+r.nom).toLowerCase().indexOf(q)<0) return false;
    return true;
  });
  if(!rows.length) return '<p class="muted">Aucun appartement.</p>';
  var initials = g.months.map(function(m){ var lbl=m.label; return '<th title="'+esc(lbl)+'">'+esc(lbl.charAt(0).toUpperCase())+'<br><span style="font-weight:400">'+esc(lbl.slice(-2))+'</span></th>'; }).join('');
  var anyBefore = rows.some(function(r){ return r.avant; });
  return '<table class="grid"><tr><th></th>'+(anyBefore?'<th title="Avant la période affichée">Av.</th>':'')+initials+'<th>Dû</th></tr>'+rows.map(function(r){
    return '<tr onclick="go(\'appart\',\''+esc(r.id)+'\')"><td class="who"><b>'+esc(r.id)+'</b> '+esc(r.nom)+'</td>'+
      (anyBefore?'<td><div class="c c-'+(r.avant||'F')+'">'+(r.avant?SYMB.R:'')+'</div></td>':'')+
      r.cells.map(function(c, i){ return '<td><div class="c c-'+c+'" title="'+esc(g.months[i].label+' : '+(CODE_LABEL[c]||''))+'">'+(SYMB[c]||'')+'</div></td>'; }).join('')+
      '<td style="white-space:nowrap" class="'+(r.du>0?'st-retard':'muted')+'">'+(r.du>0?dh(r.du):'—')+'</td></tr>';
  }).join('')+'</table>';
}

function chart(serie){
  if(!serie || !serie.length) return '';
  var W=640, H=230, pl=46, pr=10, pt=12, pb=34, n=serie.length;
  var maxV = Math.max(1, Math.max.apply(null, serie.map(function(s){ return Math.max(s.enc, s.dep); })));
  var soldes = serie.map(function(s){ return s.solde; });
  var sMin = Math.min(0, Math.min.apply(null, soldes)), sMax = Math.max(1, Math.max.apply(null, soldes));
  var cw = (W-pl-pr)/n, bw = Math.max(4, cw*0.32);
  var y = function(v){ return pt + (H-pt-pb) * (1 - v/maxV); };
  var ys = function(v){ return pt + (H-pt-pb) * (1 - (v-sMin)/(sMax-sMin)) ; };
  var parts = [];
  [0, 0.5, 1].forEach(function(t){ var v=maxV*t, yy=y(v); parts.push('<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+yy+'" y2="'+yy+'" stroke="#e5e9ed"/><text x="'+(pl-6)+'" y="'+(yy+4)+'" font-size="11" text-anchor="end" fill="#5b6670">'+Math.round(v/1000)+'k</text>'); });
  var line = [];
  serie.forEach(function(s, i){
    var x0 = pl + i*cw + cw/2;
    parts.push('<rect x="'+(x0-bw-1)+'" y="'+y(s.enc)+'" width="'+bw+'" height="'+(H-pb-y(s.enc))+'" rx="2" fill="#2f6b3a"><title>'+esc(s.label)+' – encaissé '+dh(s.enc)+'</title></rect>');
    parts.push('<rect x="'+(x0+1)+'" y="'+y(s.dep)+'" width="'+bw+'" height="'+(H-pb-y(s.dep))+'" rx="2" fill="#a42a1e"><title>'+esc(s.label)+' – dépensé '+dh(s.dep)+'</title></rect>');
    if(i%2===0 || n<=6) parts.push('<text x="'+x0+'" y="'+(H-pb+16)+'" font-size="11" text-anchor="middle" fill="#5b6670">'+esc(s.label)+'</text>');
    line.push(x0+','+ys(s.solde));
  });
  parts.push('<polyline points="'+line.join(' ')+'" fill="none" stroke="#2c4f7c" stroke-width="2"/>');
  var last = serie[n-1];
  parts.push('<text x="'+(W-pr)+'" y="'+Math.max(12, ys(last.solde)-8)+'" font-size="12" text-anchor="end" fill="#2c4f7c" font-weight="700">'+dh(last.solde)+'</text>');
  return '<svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="Encaissements, dépenses et solde sur 12 mois">'+parts.join('')+'</svg>';
}

function catCard(d){

  var max = d.parCategorie[cats[0]];
  return '<div class="card"><div class="h2">Dépenses '+d.kpi.annee+' par catégorie</div>'+cats.map(function(c){
    var v=d.parCategorie[c];
    return '<div style="margin:6px 0"><div style="display:flex;justify-content:space-between;font-size:15px"><span>'+esc(c)+'</span><b>'+dh(v)+'</b></div>'+
      '<div style="background:#eef1f4;border-radius:6px;height:10px"><div style="width:'+Math.max(2,Math.round(v/max*100))+'%;height:10px;border-radius:6px;background:#0b6e4f"></div></div></div>';
  }).join('')+'</div>';
}

function dlModele(){
  guard(api('import.modele').then(function(m){
    busy(true);
    return loadXlsx().then(function(X){
      var wb = X.utils.book_new();
      var lis = [['Modèle de démarrage – à remplir une seule fois'],[''],
        ['Paramètres','Nom et adresse du syndicat, cotisation mensuelle, date_depart (mois AAAA-MM, ex. 2027-01), solde bancaire la veille du départ, RIB.'],
        ['Bureau','Un membre par ligne. Rôles : admin, syndic, trésorier, secrétaire, consultation (plusieurs possibles, séparés par des virgules). Titre légal : syndic, syndic adjoint ou membre. Dates : JJ/MM/AAAA.'],
        ['Appartements','Une ligne par appartement. Payeur : propriétaire ou occupant. Langue : FR ou AR. « Dernier mois payé avant départ » : AAAA-MM (ex. 2026-12 = à jour au départ). Autre dette : montant en DH dû avant le départ, hors mois.'],
        ['Contrats','Facultatif. Dates JJ/MM/AAAA.'],
        ['Factures à payer','Facultatif : factures reçues et non payées au démarrage. Catégories possibles : '+m.categories.join(', ')+'.'],
        [''],['Téléphones : format marocain (06…, 07…, ou +212…).']];
      X.utils.book_append_sheet(wb, X.utils.aoa_to_sheet(lis), 'Lisez-moi');
      m.feuilles.forEach(function(f){
        var ws = X.utils.aoa_to_sheet([f.header].concat(f.rows));
        // colonnes texte (mois, téléphones) : éviter qu'Excel les transforme en dates ou nombres
        f.header.forEach(function(h, j){
          if(!/mois|Tél|Téléphone|Valeur|Id/.test(h)) return;
          for(var r=0;r<=f.rows.length+80;r++){ var ref=X.utils.encode_cell({r:r,c:j}); if(!ws[ref]) ws[ref]={t:'s',v:''}; ws[ref].t='s'; ws[ref].z='@'; ws[ref].v=String(ws[ref].v==null?'':ws[ref].v); }
          ws['!ref'] = X.utils.encode_range({s:{r:0,c:0}, e:{r:Math.max(f.rows.length+80, X.utils.decode_range(ws['!ref']).e.r), c:f.header.length-1}});
        });
        ws['!cols'] = f.header.map(function(h){ return {wch: Math.max(12, h.length+2)}; });
        X.utils.book_append_sheet(wb, ws, sheetName(f.name));
      });
      busy(false);
      showDocSheet({ name: m.nom+'.xlsx', mime:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet', data: X.write(wb,{bookType:'xlsx',type:'base64'}) });
    });
  }).catch(function(e){ busy(false); throw e; }));
}
/** Lit le fichier choisi → { nomFeuille: [ {colonne: valeur} ] } (dates converties en texte). */
function readClasseur(){
  var f = $('imp_f').files && $('imp_f').files[0];
  if(!f) return Promise.reject(new Error('Choisissez le fichier Excel rempli.'));
  return loadXlsx().then(function(X){
    return new Promise(function(res, rej){
      var fr = new FileReader();
      fr.onerror = function(){ rej(new Error('Lecture du fichier impossible.')); };
      fr.onload = function(){
        try{
          var wb = X.read(new Uint8Array(fr.result), {type:'array', cellDates:true});
          var out = {};
          wb.SheetNames.forEach(function(n){
            if(n==='Lisez-moi') return;
            out[n] = X.utils.sheet_to_json(wb.Sheets[n], {defval:'', raw:true}).map(function(row){
              var o = {}; Object.keys(row).forEach(function(k){ var v=row[k];
                o[k] = v instanceof Date ? v.getFullYear()+'-'+('0'+(v.getMonth()+1)).slice(-2)+'-'+('0'+v.getDate()).slice(-2) : v; });
              return o;
            });
          });
          res(out);
        }catch(e){ rej(new Error('Fichier Excel illisible.')); }
      };
      fr.readAsArrayBuffer(f);
    });
  });
}
function verifImport(){
  readClasseur().then(function(wb){
    return api('import.verifier',{classeur:wb}).then(function(v){
      window.__imp = wb;
      var r = v.resume;
      var h = '<div class="card '+(v.propre?'ok-box':'')+'" style="margin-top:12px"><b>'+(v.propre?'✔ Fichier correct':'✗ '+v.erreurs.length+' erreur(s) à corriger')+'</b><br>'+
        r.appartements+' appartements · '+r.bureau+' membres du bureau · '+r.contrats+' contrats · '+r.factures+' factures à payer · '+r.parametres+' paramètres</div>';
      if(v.erreurs.length) h += '<div class="card list"><div class="h2">Erreurs</div>'+v.erreurs.map(function(e){ return '<div class="item"><b>'+esc(e.feuille)+'</b> ligne '+esc(e.ligne)+' : '+esc(e.message)+'</div>'; }).join('')+'</div>';
      if(v.avertissements.length) h += '<div class="card list"><div class="h2">À savoir</div>'+v.avertissements.map(function(e){ return '<div class="item muted">'+esc(e.feuille)+' ligne '+esc(e.ligne)+' : '+esc(e.message)+'</div>'; }).join('')+'</div>';
      if(v.propre) h += '<button class="btn pri" id="imp_go">Importer ces données</button><p class="muted">Remplace les appartements, le bureau (sauf l\'admin) et les paramètres du fichier. Les données d\'exemple et de test sont supprimées, et les liens copropriétaires de test désactivés.</p>';
      $('imp_out').innerHTML = h;
      if(v.propre) $('imp_go').onclick = function(){
        var b=$('imp_go'); if(b.getAttribute('data-c')!=='1'){ b.setAttribute('data-c','1'); b.textContent='Confirmer l\'import ?'; return; }
        guard(api('import.appliquer',{classeur:window.__imp}).then(function(res){
          view('Démarrage terminé', '<div class="card ok-box"><p class="big">✔ Données importées</p><p>'+res.appartements+' appartements, '+res.bureau+' membres du bureau, '+res.contrats+' contrats, '+res.factures+' factures à payer.</p>'+
            '<p>Prochaines étapes : <b>Accès bureau</b> (liens des membres), puis <b>Liens copropriétaires</b> (envoi aux appartements).</p></div><button class="btn sec" onclick="go(\'admin\')">Retour à l\'admin</button>');
        }));
      };
    });
  }).catch(function(e){ showErr(e.message); });
}

function yearSelect(id, ys, sel){ return '<select id="'+id+'" style="width:auto">'+ys.map(function(y){ return '<option'+(y===sel?' selected':'')+'>'+y+'</option>'; }).join('')+'</select>'; }
function n(v){ return v===null||v===undefined?'—':(v===0?'0':dh(v).replace(' DH','')); }
function tbl(head, rows){ return '<div class="gridwrap"><table style="border-collapse:collapse;font-size:14px;width:100%"><tr>'+head.map(function(h){ return '<th style="text-align:left;border-bottom:1px solid var(--ink);padding:6px 6px">'+h+'</th>'; }).join('')+'</tr>'+rows.join('')+'</table></div>'; }
function tr(cells, strong){ return '<tr style="'+(strong?'font-weight:700;':'')+'border-bottom:1px solid var(--line)">'+cells.map(function(c,i){ return '<td style="padding:6px;'+(i>1?'text-align:right;white-space:nowrap':'')+'">'+c+'</td>'; }).join('')+'</tr>'; }

ROUTES.etats = function(y){
  guard(api('etats.exercices').then(function(ex){
    var yy = Number(y) || ex.exercices[ex.exercices.length-1];
    return api('etats.get',{exercice:yy}).then(function(e){
      var h = '<div class="card"><label>Exercice</label>'+yearSelect('et_y', ex.exercices, yy)+
        (e.provisoire?' <span class="muted">en cours : chiffres provisoires</span>':'')+
        '<div class="row"><button class="btn small pri" onclick="etatsPdf('+yy+',false)">PDF des états (annexes 10–12)</button><button class="btn small sec" onclick="etatsPdf('+yy+',true)">PDF des livres</button></div></div>';
      // Annexe 10
      h += '<div class="card"><div class="h2">Annexe 10 – Suivi des contributions</div>'+tbl(['Copropriétaire','Lot','Solde 01/01','Annuel','Paiements','Solde 31/12'],
        e.a10.lignes.map(function(r){ return tr([esc(r.nom), esc(r.id), n(r.ouverture), n(r.annuel), n(r.paiements), '<span class="'+(r.solde>0?'st-retard':'')+'">'+n(r.solde)+'</span>']); })
        .concat([tr(['Total','',n(e.a10.total.ouverture),n(e.a10.total.annuel),n(e.a10.total.paiements),n(e.a10.total.solde)], true)]))+'</div>';
      // Annexe 11
      function side(rows, prev){ return rows.map(function(r,i){ var p=prev?prev[i]:null;
        if(r.titre) return '<tr><td colspan="3" style="padding:8px 6px 4px;font-weight:700">'+esc(r.ligne+' – '+r.libelle)+'</td></tr>';
        return tr([esc((r.ligne?r.ligne+' ':'')+r.libelle), p?n(p.v):'—', n(r.v)], r.total); }); }
      h += '<div class="card"><div class="h2">Annexe 11 – Bilan simplifié au '+esc(e.a11.arrete)+'</div>'+
        '<p class="muted">'+(e.a11.n.equilibre?'✓ Bilan équilibré':'✗ Bilan déséquilibré : à vérifier')+'</p>'+
        tbl(['Actif','N-1 approuvé','Exercice'], side(e.a11.n.actif, e.a11.n1&&e.a11.n1.actif))+
        tbl(['Passif','N-1 approuvé','Exercice'], side(e.a11.n.passif, e.a11.n1&&e.a11.n1.passif))+'</div>';
      // Annexe 12
      function bl(rows){ return rows.filter(function(r){ return r.groupe||r.n||r.budget||r.n1; }).map(function(r){ return tr([esc(r.compte), esc(r.libelle), n(r.n1), n(r.budget), n(r.n)], r.groupe); }); }
      var T = e.a12.totaux;
      function tt(l, t){ return tr(['', esc(l), n(t.n1), n(t.budget), n(t.n)], true); }
      h += '<div class="card"><div class="h2">Annexe 12 – Produits et charges</div>'+
        tbl(['Compte','Libellé','N-1','Budget','Réalisé'], bl(e.a12.chargesCourantes).concat([tt('Total charges courantes (I)', T.I)])
          .concat(bl(e.a12.produitsCourants)).concat([tt('Total produits courants (II)', T.II), tt('Résultat courant (III = II − I)', T.III)])
          .concat(bl(e.a12.chargesNonCourantes)).concat([tt('Total charges non courantes (IV)', T.IV)])
          .concat(bl(e.a12.produitsNonCourants)).concat([tt('Total produits non courants (V)', T.V), tt('Résultat non courant (VI = V − IV)', T.VI), tt('Excédent ou déficit (III + VI)', T.resultat)]))+'</div>';
      view('États annuels', h);
      $('et_y').onchange = function(){ go('etats', this.value); };
    });
  }));
};

ROUTES.budget = function(y){
  guard(api('etats.exercices').then(function(ex){

      var g = null;
      h += '<div class="card"><div class="gridwrap"><table style="border-collapse:collapse;font-size:14px;width:100%"><tr><th style="text-align:left">Compte</th><th style="text-align:right">N-1</th><th style="text-align:right">Prévu</th><th style="text-align:right">Réalisé</th><th style="text-align:right">%</th></tr>'+
        b.lignes.map(function(l){
          var head = l.groupe!==g ? '<tr><td colspan="5" style="padding:12px 4px 4px;font-weight:700;border-bottom:1px solid var(--ink)">'+titres[l.groupe]+'</td></tr>' : '';
          g = l.groupe;
          var pct = l.prevu ? Math.round(l.realise/l.prevu*100) : null;
          var warn = pct!==null && l.groupe.indexOf('charges')===0 && pct>=80;
          return head+'<tr style="border-bottom:1px solid var(--line)"><td style="padding:5px 4px">'+esc(l.compte)+' <span class="muted">'+esc(l.libelle)+'</span></td>'+

            '<td style="text-align:right">'+n(l.realise)+'</td><td style="text-align:right" class="'+(warn?'st-retard':'')+'">'+(pct===null?'':pct+' %')+'</td></tr>';
        }).join('')+'</table></div></div>'+(ed?'<button class="btn pri" onclick="budgetSave('+yy+')">Enregistrer le budget</button>':'');
      view('Budget '+yy, h);
      $('bu_y').onchange = function(){ go('budget', this.value); };
    });
  }));
};
function budgetProposer(){ Array.prototype.forEach.call(document.querySelectorAll('.bu_v'), function(i){ var v=Number(i.getAttribute('data-n1')); if(v>0 && !i.value) i.value=Math.ceil(v/100)*100; }); }
function budgetSave(y){
  var lignes = Array.prototype.map.call(document.querySelectorAll('.bu_v'), function(i){ return {compte:i.getAttribute('data-c'), prevu:i.value||0}; });
  guard(api('budget.enregistrer',{exercice:y, ref:$('bu_ref').value, lignes:lignes}).then(function(r){ go('budget', y); setTimeout(function(){ showErr('✓ Budget enregistré ('+r.lignes+' lignes).'); },400); }));
}

        '<br><a href="'+esc(c.etats)+'">États de synthèse (PDF)</a> · <a href="'+esc(c.livres)+'">Livres (PDF)</a>'+(c.avertissements?'<br><span class="muted">'+esc(c.avertissements)+'</span>':'')+'</div>';

/** Charge la bibliothèque Excel (SheetJS) à la demande. */
function loadXlsx(){
  if(window.XLSX) return Promise.resolve(window.XLSX);
  return new Promise(function(res, rej){
    var s=document.createElement('script');
    s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    s.onload=function(){ window.XLSX ? res(window.XLSX) : rej(new Error('Bibliothèque Excel indisponible')); };
    s.onerror=function(){ rej(new Error('Bibliothèque Excel indisponible')); };
    document.head.appendChild(s);
  });
}
function sheetName(n){ return String(n).replace(/[\\\/\?\*\[\]:]/g,' ').slice(0,31); }
function xlsxFile(name, tabs){
  return loadXlsx().then(function(X){
    var wb = X.utils.book_new();
    tabs.forEach(function(t){ X.utils.book_append_sheet(wb, X.utils.aoa_to_sheet([t.header].concat(t.rows)), sheetName(t.name)); });
    return { name: name, mime: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet', data: X.write(wb, {bookType:'xlsx', type:'base64'}) };
  });
}
/** Repli si la bibliothèque Excel ne se charge pas : CSV (séparateur « ; »), lisible par Excel. */
function csvFile(name, t){
  var cell = function(c){ var s=String(c==null?'':c); if(/^[=+\-@]/.test(s)) s="'"+s; return /[";\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s; };
  var csv = '﻿'+[t.header].concat(t.rows).map(function(r){ return r.map(cell).join(';'); }).join('\r\n');
  return { name: name.replace(/\.xlsx$/,'.csv'), mime: 'text/csv', data: btoa(unescape(encodeURIComponent(csv))) };
}
function exportTab(){
  var d = window.__dn; if(!d) return;
  var name = 'Syndic – '+d.name+' – '+today()+'.xlsx';
  busy(true);
  xlsxFile(name, [d]).catch(function(){ return csvFile(name, d); }).then(function(f){ busy(false); showDocSheet(f); });
}
function exportAll(){
  guard(api('admin.export').then(function(x){
    var name = 'Syndic – classeur complet – '+x.date+'.xlsx';
    busy(true);
    return xlsxFile(name, x.onglets).then(function(f){ busy(false); showDocSheet(f); }, function(e){ busy(false); showErr(e.message+' : téléchargez les onglets un par un (format CSV).'); });
  }));
}

/** Section « Fichiers » en bas de chaque espace : les fichiers listés dans l'application. */
function dossiersBox(){ return '<div id="dossiers"><div class="h2" style="margin-top:18px">📁 Fichiers</div><p class="muted">Chargement…</p></div>'; }
function fileIco(mime){ return /pdf/.test(mime)?'📄':/image/.test(mime)?'🖼️':/spreadsheet/.test(mime)?'📊':'📎'; }
function fileSize(n){ return n>1048576 ? (n/1048576).toFixed(1)+' Mo' : Math.max(1,Math.round(n/1024))+' Ko'; }
function loadDossiers(espace){
  apiOk('fichiers.liste', {espace:espace}).then(function(r){
    var box = $('dossiers'); if(!box) return;
    if(!r.ok || !r.data.length){ box.innerHTML=''; return; }
    box.innerHTML = '<div class="h2" style="margin-top:18px">📁 Fichiers</div>'+r.data.map(function(d){
      return '<details class="card" style="padding:12px 16px" data-esp="'+esc(espace)+'" data-i="'+d.index+'"><summary style="cursor:pointer;font-weight:700">📂 '+esc(d.label)+'</summary>'+
        '<div class="flist"><p class="muted">Chargement…</p></div></details>';
    }).join('');
    // Le contenu d'un dossier n'est chargé qu'à son ouverture
    Array.prototype.forEach.call(box.querySelectorAll('details[data-i]'), function(det){
      det.addEventListener('toggle', function(){
        if(!det.open || det.getAttribute('data-loaded')) return;
        det.setAttribute('data-loaded','1');
        apiOk('fichiers.liste', {espace:det.getAttribute('data-esp'), dossier:det.getAttribute('data-i')}).then(function(x){
          var out = det.querySelector('.flist');
          if(!x.ok){ out.innerHTML='<p class="muted">'+esc(x.error)+'</p>'; det.removeAttribute('data-loaded'); return; }
          var d = x.data;
          out.innerHTML = d.files.length ? '<div class="list">'+d.files.map(function(f){
            return '<div class="item" style="display:flex;align-items:center;gap:10px"><span style="font-size:22px">'+fileIco(f.mime)+'</span>'+
              '<div style="flex:1;min-width:0"><div style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(f.name)+'</div><span class="muted">'+esc(f.date)+' · '+fileSize(f.size)+'</span></div>'+
              '<button class="btn small sec" style="margin:0" onclick="openDoc(\''+esc(f.id)+'\')">Ouvrir</button></div>';
          }).join('')+(d.total>d.files.length?'<p class="muted">… et '+(d.total-d.files.length)+' plus anciens.</p>':'')+'</div>' : '<p class="muted">Aucun fichier.</p>';
        }, function(){ det.removeAttribute('data-loaded'); });
      });
    });
  }, function(){ var box=$('dossiers'); if(box) box.innerHTML=''; });
}

// ---------- Visionneuse : les fichiers sont servis par l'application, sans compte Google ----------
function isDriveFile(href){ return /drive\.google\.com\/(file\/d\/|open\?id=)/.test(href||''); }
function openDoc(idOrUrl){
  busy(true);
  var p = (window.R && R.session && !S.session) ? call('residentFichier', R.session, idOrUrl) : call('api', S.session, 'fichier.ouvrir', /^https?:/.test(idOrUrl)?{url:idOrUrl}:{id:idOrUrl});
  p.then(function(res){
    busy(false);
    if(!res.ok) return showErr(res.error==='SESSION_EXPIREE'?'Session expirée, reconnectez-vous.':res.error);
    showDocSheet(res.data);
  }, function(e){ busy(false); showErr(e.message); });
}
var SAFE_MIME = ['application/pdf','image/jpeg','image/png','image/webp','image/gif','image/heic','image/heif'];
/** Affiche un fichier {name, mime, data base64} : Ouvrir / Télécharger. */
function showDocSheet(f){
    var mime = SAFE_MIME.indexOf(f.mime) >= 0 ? f.mime : 'application/octet-stream'; // jamais de HTML exécutable
    var bin = atob(f.data), bytes = new Uint8Array(bin.length);
    for(var i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
    var url = URL.createObjectURL(new Blob([bytes], {type:mime}));
    f = { name: f.name, mime: mime };
    var old = $('docsheet'); if(old) old.remove();
    var s = document.createElement('div');
    s.id='docsheet';
    s.style.cssText='position:fixed;left:0;right:0;bottom:0;z-index:20;background:#fff;border-top:1px solid var(--line);box-shadow:0 -6px 24px rgba(0,0,0,.15);padding:16px;border-radius:16px 16px 0 0;max-height:85vh;overflow:auto';
    s.innerHTML = '<div style="max-width:680px;margin:0 auto"><div style="display:flex;align-items:center;gap:10px"><b style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+fileIco(f.mime)+' '+esc(f.name)+'</b>'+
      '<button class="btn small sec" style="margin:0" onclick="closeDoc()">✕</button></div>'+
      (/^image\//.test(f.mime)?'<img src="'+url+'" alt="" style="width:100%;margin-top:10px;border-radius:10px">':'')+
      '<div class="row"><a class="btn pri" style="flex:1" href="'+url+'" target="_blank" rel="noopener">Ouvrir</a>'+
      '<a class="btn sec" style="flex:1" href="'+url+'" download="'+esc(f.name)+'">Télécharger</a></div></div>';
    document.body.appendChild(s);
}
function closeDoc(){ var s=$('docsheet'); if(s) s.remove(); }
// Tous les liens vers des fichiers Drive passent par la visionneuse
document.addEventListener('click', function(e){
  var a = e.target && e.target.closest ? e.target.closest('a') : null;
  if(!a || !isDriveFile(a.getAttribute('href'))) return;
  e.preventDefault();
  openDoc(a.getAttribute('href'));
}, true);
function renderSecretariat(){

  '</div><p class="muted">Les membres du bureau, les appartements, les paramètres et les textes des messages se modifient dans le tableur (onglets Bureau, Appartements, Paramètres, Messages).</p>'+dossiersBox());

<script>
// =====================================================================
// Vue copropriétaire (lien ?r=… + code PIN) : son appartement, ses actions,
// et les chiffres globaux de l'immeuble (jamais d'autre appartement)
// =====================================================================
var RSTORE = 'syndic.resident';
var R = { r:null, session:null, data:null };

/** Appel « copropriétaire » : par le lien (session copropriétaire) ou depuis l'Espace bureau (« Mon appartement »). */
function rCall(fnLien, actionBureau, payload){
  if(R.bureau) return apiOk(actionBureau, payload||{});
  return payload===undefined ? call(fnLien, R.session) : call(fnLien, R.session, payload);
}

// Membre du bureau qui habite l'immeuble : sa page d'appartement, sans second lien
ROUTES.monappart = function(){
  R.bureau = true;
  guard(api('monappart.get').then(function(d){ R.data = d; residentRender(); }));
};

function residentScreen(r){
  R.r = r;
  var st = null; try{ st = JSON.parse(localStorage.getItem(RSTORE)||'null'); }catch(e){}
  if(st && st.r===r && st.session) return residentLoad(st.session);
  residentPin(r);
}
function residentPin(r){
  busy(true);
  call('residentStatus', r).then(function(res){
    busy(false);
    if(!res.ok) return view('Syndic', '<div class="card"><div class="err">'+esc(res.error)+'</div></div>');
    var setup = res.data.needPinSetup;
    view('Appartement '+res.data.appartement, '<div class="card"><p>Bienvenue. Cette page montre la situation de l\'<b>appartement '+esc(res.data.appartement)+'</b>.</p>'+
      (setup?'<p>Choisissez un <b>code à 4 chiffres</b>. Il vous sera demandé de temps en temps.</p>':'<p>Entrez votre <b>code à 4 chiffres</b>.</p>')+
      '<input id="rpin" class="pin" type="password" inputmode="numeric" maxlength="4" autocomplete="off">'+
      (setup?'<label>Retapez le code</label><input id="rpin2" class="pin" type="password" inputmode="numeric" maxlength="4" autocomplete="off">':'')+
      '<button class="btn pri" id="rgo">Entrer</button>'+
      (setup?'':'<p class="muted">Code oublié ? Demandez un nouveau lien au trésorier du syndic.</p>')+'</div>');
    $('homeBtn').style.display='none';
    $('rgo').onclick = function(){
      var p=$('rpin').value;
      if(setup && p!==$('rpin2').value) return showErr('Les deux codes ne sont pas identiques.');
      busy(true);
      call(setup?'residentSetPin':'residentLoginPin', r, p).then(function(x){
        busy(false);
        if(!x.ok) return showErr(x.error);
        try{ localStorage.setItem(RSTORE, JSON.stringify({r:r, session:x.data.session})); }catch(e){}
        residentLoad(x.data.session);
      }, function(e){ busy(false); showErr(e.message); });
    };
  }, function(e){ busy(false); view('Syndic','<div class="card"><div class="err">'+esc(e.message)+'</div></div>'); });
}

function residentLoad(session){
  R.session = session;
  var ck = 'syndic.rview.'+String(R.r||'').slice(0,16), vu = null;
  try{ vu = JSON.parse(localStorage.getItem(ck)||'null'); }catch(e){}
  if(vu){ R.data = vu; residentRender(); }          // déjà vu sur ce téléphone : affichage immédiat
  else busy(true);
  call('residentView', session).then(function(res){
    busy(false);
    if(!res.ok){ try{ localStorage.removeItem(RSTORE); localStorage.removeItem(ck); }catch(e){} return residentPin(R.r); }
    var changed = !vu || JSON.stringify(vu) !== JSON.stringify(res.data);
    try{ localStorage.setItem(ck, JSON.stringify(res.data)); }catch(e){}
    R.data = res.data;
    if(changed && (!vu || (window.scrollY < 80 && !userIsEditing() && !$('rform').innerHTML))){ S.silent = !!vu; residentRender(); S.silent = false; }
  }, function(e){ busy(false); if(!vu) view('Syndic','<div class="card"><div class="err">'+esc(e.message)+'</div></div>'); });
}

var SIG_ST = { 'en attente':'En attente de vérification', 'validé':'✓ Confirmé', 'refusé':'✗ Refusé' };
var DEM_ST = { 'reçue':'Envoyée', 'en cours':'En cours de traitement', 'traitée':'✓ Traitée' };
/** Étapes d'un envoi : envoyé → lu par le syndic → réponse / décision. */
function etapes(list){
  return '<div class="etapes">'+list.map(function(e){ return '<span class="'+(e[1]?'fait':'')+'">'+(e[1]?'✓ ':'○ ')+esc(e[0])+(e[1]&&e[1]!==true?' <small>'+esc(e[1])+'</small>':'')+'</span>'; }).join('')+'</div>';
}
/** Un résumé de l'état des envois, pour détecter « du nouveau » depuis la dernière visite (mémorisé sur ce téléphone). */
function envoisEmpreinte(d){ return d.signalements.map(function(s){ return s.id+':'+s.statut; }).concat(d.demandes.map(function(s){ return s.id+':'+s.statut+':'+(s.reponse||'').length; })).join('|'); }
function envoisNouveautes(d){
  var key = 'syndic.envois.'+d.appartement.id, old = null;
  try { old = localStorage.getItem(key); localStorage.setItem(key, envoisEmpreinte(d)); } catch(e){ return []; }
  if(old === null) return [];
  var prev = {}; old.split('|').forEach(function(x){ var p=x.split(':'); prev[p[0]] = x; });
  var out = [];
  d.signalements.forEach(function(s){ var p = prev[s.id]; if(p && p !== s.id+':'+s.statut && s.statut!=='en attente') out.push('Votre paiement de '+dh(s.montant)+' : '+(s.statut==='validé'?'confirmé':'refusé')); });
  d.demandes.forEach(function(s){ var p = prev[s.id]; if(p && p !== s.id+':'+s.statut+':'+(s.reponse||'').length) out.push('Votre demande « '+s.type+' » : '+(s.reponse?'le syndic a répondu':DEM_ST[s.statut]||s.statut)); });
  return out;
}

function residentRender(){
  var d = R.data, a = d.appartement;
  var st = {retard:'En retard', a_jour:'À jour', avance:'Payé d\'avance'}[a.statut];
  var bg = {retard:'#fde8e7', a_jour:'#e6f4ea', avance:'#e8f0fe'}[a.statut];
  var h = '<p class="muted" style="margin-top:0">'+esc(d.syndicat)+'</p>'+
    '<div class="card" style="background:'+bg+'"><div class="big" style="font-size:24px">Bonjour '+esc(d.personne||a.nom)+'</div>'+
    '<div>Appartement '+esc(a.id)+(d.personne && d.personne!==a.nom ? ' · '+esc(a.nom) : '')+'</div>'+
    '<div class="st-'+a.statut+'" style="font-size:24px;margin-top:8px">'+(a.statut==='retard'?'✗ ':'✓ ')+st+'</div>'+
    '<p style="font-size:20px;margin:10px 0 0">'+(a.du>0 ? 'Il reste <b>'+dh(a.du)+'</b> à payer'+(function(){ var r=a.mois.filter(function(m){return m.code==='R';}).map(function(m){return m.label;}); return r.length?' ('+esc(r.join(', '))+')':''; })()+'.' : 'Tout est payé'+(a.avance>0?' jusqu\'à '+esc(a.payeJusqua):'')+'. Merci !')+'</p>'+
    '<p style="margin:6px 0 0">Payé jusqu\'à : <b>'+esc(a.payeJusqua)+'</b></p>'+
    '<p class="muted" style="margin-bottom:0">Cotisation : '+dh(d.mensuel)+' par mois.</p></div>';

  // Actions
  h += '<button class="btn pri" onclick="rForm(\'paiement\')">💰 Signaler un paiement</button>'+
    '<button class="btn sec" onclick="rForm(\'demande\')">✉️ Envoyer une demande</button>'+
    (d.contact && d.contact.whatsapp ? '<a class="btn wa" target="_blank" href="'+esc(d.contact.whatsapp)+'">Écrire au trésorier sur WhatsApp</a>' : '')+'<div id="rform"></div>';

  // Suivi : paiements signalés et demandes, avec accusé de lecture et réponse
  function sigItem(s){
    var cls = s.statut==='refusé'?'st-retard':s.statut==='validé'?'st-a_jour':'';
    return '<div class="item"><b>'+dh(s.montant)+'</b> · '+esc(s.mode)+(s.datePaiement?' du '+esc(s.datePaiement):'')+'<br>'+
      '<b class="'+cls+'">'+esc(SIG_ST[s.statut]||s.statut)+'</b>'+(s.statut==='validé'&&s.recu?' – reçu n° '+esc(s.recu):'')+
      (s.motif?'<br>Motif : '+esc(s.motif):'')+
      etapes([['Envoyé', s.date], ['Vu par le syndic', s.lu || (s.statut!=='en attente')], [s.statut==='refusé'?'Refusé':'Confirmé', s.statut!=='en attente' ? (s.traite||true) : '']])+'</div>';
  }
  function demItem(s){
    return '<div class="item"><b>'+esc(s.type)+'</b><br><span class="muted">« '+esc(String(s.message).slice(0,200))+' »</span><br>'+
      '<b class="'+(s.statut==='traitée'?'st-a_jour':'')+'">'+esc(DEM_ST[s.statut]||s.statut)+'</b>'+
      etapes([['Envoyée', s.date], ['Lue par le syndic', s.lu || (s.statut!=='reçue')], ['Réponse', s.reponse ? (s.traite||true) : '']])+
      (s.reponse?'<div class="reponse"><b>Réponse du syndic :</b><br>'+esc(s.reponse).replace(/\n/g,'<br>')+'</div>':'')+'</div>';
  }
  function bloc(titre, list, item, vide){
    return '<div class="card"><div class="h2">'+titre+'</div>'+(list.length ? '<div class="list">'+list.slice(0,3).map(item).join('')+'</div>'+
      (list.length>3?'<details><summary class="btn sec">Voir tout ('+list.length+')</summary><div class="list">'+list.slice(3).map(item).join('')+'</div></details>':'')
      : '<p class="muted">'+vide+'</p>')+'</div>';
  }
  var nouv = envoisNouveautes(d);
  if(nouv.length) h = '<div class="card nouveau"><b>Du nouveau depuis votre dernière visite</b><ul>'+nouv.map(function(x){ return '<li>'+esc(x)+'</li>'; }).join('')+'</ul></div>' + h;
  h += bloc('Mes paiements signalés', d.signalements, sigItem, 'Aucun paiement signalé. Après un virement, touchez « Signaler un paiement ».');
  h += bloc('Mes demandes', d.demandes, demItem, 'Aucune demande envoyée.');

  h += '<div class="card"><div class="h2">Mes mois</div>'+legend()+'<div class="mchips">'+a.mois.map(function(m){
    return '<span class="c c-'+m.code+'">'+esc(m.label)+' '+(SYMB[m.code]||'')+'</span>';
  }).join('')+'</div></div>';

  function payItem(p){
    return '<div class="item"><b>'+esc(p.date)+'</b> · <b>'+dh(p.montant)+'</b><br><span class="muted">'+esc(p.mois||'')+' · '+esc(p.mode||'')+'</span>'+
      (p.recu?'<br><a target="_blank" href="'+esc(p.recu)+'">📄 Reçu n° '+esc(p.numero)+'</a>':'<br><span class="muted">Reçu n° '+esc(p.numero)+'</span>')+'</div>';
  }
  var pays = a.paiements.slice(0,24);
  h += '<div class="card"><div class="h2">Mes derniers paiements</div>'+(pays.length?'<div class="list">'+pays.slice(0,3).map(payItem).join('')+'</div>'+
    (pays.length>3?'<details><summary class="btn sec">Voir tous mes paiements ('+pays.length+')</summary><div class="list">'+pays.slice(3).map(payItem).join('')+'</div></details>':'')
    :'<p class="muted">Aucun paiement enregistré pour l\'instant.</p>')+'</div>';

  h += residentDocs(d.documents);

  if(d.paiement.rib || d.paiement.consignes){
    h += '<div class="card"><div class="h2">Comment payer</div>'+(d.paiement.consignes?'<p>'+esc(d.paiement.consignes)+'</p>':'')+
      (d.paiement.rib?'<p>RIB du syndic :<br><b style="font-size:20px;letter-spacing:1px">'+esc(d.paiement.rib)+'</b></p>':'')+'</div>';
  }

  if(d.evenements.length){
    h += '<div class="card"><div class="h2">📅 Prochaines assemblées</div>'+d.evenements.map(function(e){
      return '<p><b>'+esc(e.type)+'</b> – '+esc(e.date)+(e.heure?' à '+esc(e.heure):'')+(e.lieu?', '+esc(e.lieu):'')+
        (e.convocation?'<br><a target="_blank" href="'+esc(e.convocation)+'">📄 Convocation</a>':'')+'</p>';
    }).join('')+'</div>';
  }
  h += residentProjets(d.projets);

  // Le détail de l'immeuble (chiffres, graphiques, PV) est replié : la page reste courte et lisible.
  var plus = residentMacro(d.immeuble);
  if(d.pvs.length){
    plus += '<div class="card"><div class="h2">Comptes rendus (PV)</div>'+d.pvs.map(function(p){
      return '<p><a target="_blank" href="'+esc(p.url)+'">📄 '+esc(p.nom)+'</a></p>';
    }).join('')+'</div>';
  }
  if(plus) h += '<details class="card"><summary class="btn sec" style="margin-top:0">Voir les comptes de l\'immeuble</summary>'+plus+'</details>';
  if(d.page) h += '<a class="btn sec" target="_blank" href="'+esc(d.page)+'">Page de la résidence</a>';
  h += '<p class="muted" style="text-align:center">Ce lien est personnel à votre appartement. Merci de ne pas le partager.</p>';
  view('Mon appartement', h);
  if(!R.bureau) $('homeBtn').style.display='none';
}

/** « Mes documents » (propres à l'appartement) et « Documents de la résidence » (publics). */
function residentDocs(docs){
  if(!docs) return '';
  function group(list){
    var cats = {}; list.forEach(function(x){ (cats[x.cat]=cats[x.cat]||[]).push(x); });
    return Object.keys(cats).map(function(c){
      return '<details style="margin:6px 0"><summary style="cursor:pointer;font-weight:700">📂 '+esc(c)+' <span class="muted">('+cats[c].length+')</span></summary><div class="list">'+
        cats[c].map(function(x){
          return '<div class="item" style="display:flex;align-items:center;gap:10px"><div style="flex:1;min-width:0"><div style="overflow:hidden;text-overflow:ellipsis">'+esc(x.label)+'</div>'+
            (x.date?'<span class="muted">'+esc(x.date)+'</span>':'')+'</div><button class="btn small sec" style="margin:0" onclick="openDoc(\''+esc(x.url)+'\')">Ouvrir</button></div>';
        }).join('')+'</div></details>';
    }).join('');
  }
  var h = '<div class="card"><div class="h2">📂 Mes documents</div>'+
    '<button class="btn pri" style="margin-top:4px" onclick="residentReleveDl()">📄 Mon relevé de compte (PDF)</button>'+

// ---------- formulaires copropriétaire ----------
function rForm(kind){
  var box = $('rform');
  if(kind==='paiement'){
    box.innerHTML = '<div class="card"><div class="h2">Signaler un paiement</div>'+
      '<p class="muted">Le trésorier vérifiera le paiement sur le compte du syndic, puis vous recevrez votre reçu.</p>'+
      '<label>Montant (DH)</label><input id="rs_m" type="number" inputmode="decimal" min="1" step="0.01">'+
      '<div class="row" id="rs_q"></div>'+
      '<label>Date du paiement</label><input id="rs_d" type="date" value="'+today()+'">'+
      '<label>Mode</label><select id="rs_mode"><option value="virement">Virement</option><option value="depot">Dépôt à la banque</option></select>'+
      '<label>Référence (facultatif)</label><input id="rs_ref" type="text">'+
      fileField('rs_f','Photo de la preuve (obligatoire)','Avis de virement, capture de l\'application bancaire ou bordereau de dépôt.')+
      '<label>Commentaire (facultatif)</label><input id="rs_c" type="text">'+
      '<button class="btn pri" id="rs_go">Envoyer</button></div>';
    var q=[['1 mois',R.data.mensuel],['3 mois',R.data.mensuel*3],['12 mois',R.data.mensuel*12]];
    if(R.data.appartement.du>0) q.unshift(['Reste à payer', R.data.appartement.du]);
    $('rs_q').innerHTML = q.map(function(x){ return '<span class="chip" data-v="'+x[1]+'">'+x[0]+' · '+dh(x[1])+'</span>'; }).join('');
    Array.prototype.forEach.call(document.querySelectorAll('#rs_q .chip'), function(c){ c.onclick=function(){ $('rs_m').value=c.getAttribute('data-v'); }; });
    $('rs_go').onclick = function(){
      if(!(Number($('rs_m').value)>0)) return showErr('Indiquez le montant.');
      readFile($('rs_f')).then(function(f){
        if(!f) throw new Error('Ajoutez la photo de la preuve.');
        busy(true);
        return rCall('residentSignalerPaiement', 'monappart.signaler', { montant:$('rs_m').value, date:$('rs_d').value, mode:$('rs_mode').value, reference:$('rs_ref').value, commentaire:$('rs_c').value, preuve:f });
      }).then(function(x){
        busy(false);
        if(!x.ok){ if(x.error==='SESSION_EXPIREE') return residentPin(R.r); return showErr(x.error); }
        R.bureau ? go('monappart') : residentLoad(R.session);
      }).catch(function(e){ busy(false); showErr(e.message); });
    };
  } else {
    box.innerHTML = '<div class="card"><div class="h2">Envoyer une demande au syndic</div>'+
      '<label>Type</label><select id="rd_t"><option>Question</option><option>Signaler un problème</option><option>Demander un document</option><option>Autre</option></select>'+
      '<label>Votre message</label><textarea id="rd_m" style="min-height:120px" placeholder="ex. La lumière du 3e étage ne fonctionne plus."></textarea>'+
      fileField('rd_f','Photo (facultatif)')+
      '<button class="btn pri" id="rd_go">Envoyer</button></div>';
    $('rd_go').onclick = function(){
      readFile($('rd_f')).then(function(f){
        busy(true);
        return rCall('residentDemande', 'monappart.demande', { type:$('rd_t').value, message:$('rd_m').value, photo:f });
      }).then(function(x){
        busy(false);
        if(!x.ok){ if(x.error==='SESSION_EXPIREE') return residentPin(R.r); return showErr(x.error); }
        R.bureau ? go('monappart') : residentLoad(R.session);
      }).catch(function(e){ busy(false); showErr(e.message); });
    };
  }
  box.scrollIntoView({behavior:'smooth'});
}

// ---------- Côté bureau : envoi des liens à tous les copropriétaires ----------
ROUTES.liensCopro = function(filtre){
  guard(api('residents.liste').then(function(list){
    var f = filtre || 'aenvoyer';
    var nLien = list.filter(function(x){return x.lien;}).length, nAct = list.filter(function(x){return x.active;}).length;
    var nEnv = list.filter(function(x){return x.envoyeLe && !x.active;}).length;
    var aEnvoyer = list.filter(function(x){ return x.lien && !x.active && !x.envoyeLe; });
    var avecEmail = aEnvoyer.filter(function(x){ return x.email; }).length;
    var rows = list.filter(function(x){
      if(f==='aenvoyer') return !x.active && !x.envoyeLe;
      if(f==='envoye') return x.envoyeLe && !x.active;
      if(f==='active') return x.active;
      return true;
    });
    var h = '<div class="card kpis"><div class="kpi">Liens créés<b>'+nLien+' / '+list.length+'</b></div><div class="kpi">Activés<b class="st-a_jour">'+nAct+'</b><span class="muted">code choisi</span></div>'+
      '<div class="kpi">Envoyés, pas activés<b>'+nEnv+'</b></div><div class="kpi">À envoyer<b>'+aEnvoyer.length+'</b></div></div>';
    if(nLien < list.length) h += '<button class="btn pri" onclick="genLiens()">1. Générer les liens manquants ('+(list.length-nLien)+')</button>';
    if(avecEmail) h += '<button class="btn pri" onclick="emailLiens()">'+(nLien<list.length?'2. ':'')+'Envoyer par e-mail à ceux qui ont une adresse ('+avecEmail+')</button>';
    h += '<p class="muted">Pour les autres : touchez « WhatsApp » sur chaque ligne, puis « envoyer » dans WhatsApp. La ligne passe en « envoyé ». Un lien déjà activé ne peut plus être affiché : en cas de problème, générez-en un nouveau depuis la fiche de l\'appartement.</p>';
    h += '<div class="row" style="margin:8px 0">'+[['aenvoyer','À envoyer'],['envoye','Envoyés, pas activés'],['active','Activés'],['tous','Tous']].map(function(c){
      return '<span class="chip" style="'+(c[0]===f?'background:var(--pri);color:#fff':'')+'" onclick="go(\'liensCopro\',\''+c[0]+'\')">'+c[1]+'</span>'; }).join('')+'</div>';
    h += '<div class="card list">'+(rows.length?rows.map(function(x){
      var st = x.active ? '<span class="st-a_jour">✓ activé</span>' : x.envoyeLe ? '<span class="muted">envoyé le '+esc(x.envoyeLe)+'</span>' : x.lien ? '<span class="muted">à envoyer</span>' : '<span class="st-retard">pas de lien</span>';
      return '<div class="item" style="display:flex;align-items:center;gap:10px"><div style="flex:1;min-width:0"><b>'+esc(x.id)+'</b> '+esc(x.nom)+'<br>'+st+
        (x.email?' <span class="muted">· ✉ e-mail</span>':'')+(!x.tel?' <span class="st-retard">· pas de téléphone</span>':'')+'</div>'+
        (x.whatsapp?'<a class="btn small wa" style="margin:0" target="_blank" href="'+esc(x.whatsapp)+'" onclick="markSent(\''+esc(x.id)+'\')">WhatsApp</a>':'')+'</div>';
    }).join(''):'<p class="muted">Aucun appartement dans cette liste.</p>')+'</div>';
    view('Liens copropriétaires', h);
  }));
};
function genLiens(){ guard(api('residents.generer').then(function(r){ go('liensCopro','aenvoyer'); setTimeout(function(){ showErr('✓ '+r.generes+' lien(s) créé(s).'); }, 500); })); }
function emailLiens(){ guard(api('residents.email').then(function(r){ go('liensCopro','aenvoyer'); setTimeout(function(){ showErr('✓ '+r.envoyes+' e-mail(s) envoyé(s).'+(r.limite?' Limite du jour atteinte : relancez demain pour les suivants.':'')); }, 500); })); }
function markSent(id){ api('residents.marquer',{id:id}).then(function(){ setTimeout(function(){ go('liensCopro','aenvoyer'); }, 1500); }).catch(function(){}); }

})); }
function incidentDem(id){ guard(api('demande.incident',{id:id}).then(function(r){ go('demandes'); setTimeout(function(){ showErr('Incident '+r.incident+' créé (Secrétariat → Incidents et travaux).'); }, 500); })); }
</script>

<script>
/** Touche « OK / Aller / Entrée » du clavier du téléphone : valide l'écran, comme le bouton principal. */
function boutonPrincipal(el){
  var box = el.closest('#rform, .card, #app') || document.getElementById('app');
  return box.querySelector('button.btn.pri:not([disabled])');
}
document.addEventListener('keydown', function(e){
  if(e.key !== 'Enter' || e.isComposing) return;
  var t = e.target;
  if(!t || t.tagName !== 'INPUT' || /^(checkbox|radio|file|button|submit)$/.test(t.type)) return;
  var b = boutonPrincipal(t);
  if(!b) return;
  e.preventDefault(); t.blur(); b.click();
});
/** Code à 4 chiffres : dès le 4e chiffre, on entre (écran de connexion, pas à la création du code). */
document.addEventListener('input', function(e){
  var t = e.target;
  if(!t || !t.classList || !t.classList.contains('pin')) return;
  if(t.value.replace(/\D/g,'').length !== 4) return;
  if(document.querySelectorAll('#app input.pin').length !== 1) return;   // création : deux champs, on laisse « Entrer »
  var b = boutonPrincipal(t); if(b){ t.blur(); setTimeout(function(){ b.click(); }, 150); }
});
start();
</script>
</body>
